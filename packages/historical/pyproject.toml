[project]
name = "hl-historical"
version = "0.1.0"
description = "Historical market data and signal verification for hl-xfgen"
requires-python = ">=3.12"
dependencies = [
    "hl-client",
    "hl-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hl_historical"]

[tool.uv.sources]
hl-client = { workspace = true }
hl-core = { workspace = true }
