[project]
name = "hl-telegram-bot"
version = "0.1.0"
description = "Personal Telegram trading bot for Hyperliquid (Phase 1 stub)"
requires-python = ">=3.12"
dependencies = [
    "hl-client",
    "hl-core",
    "hl-historical",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hl_telegram_bot"]

[tool.uv.sources]
hl-client = { workspace = true }
hl-core = { workspace = true }
hl-historical = { workspace = true }
