[project]
name = "hl-client"
version = "0.1.0"
description = "Hyperliquid perps API client for hl-perps-shell"
requires-python = ">=3.12"
dependencies = [
    "hl-core",
    "hyperliquid-python-sdk>=0.24",
    "eth-account>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hl_client"]

[tool.uv.sources]
hl-core = { workspace = true }
